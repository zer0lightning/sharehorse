name: Update SharePoint signatures

on:
  schedule:
    - cron: "12 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-sharepoint-sigs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge new SharePoint builds into BUILD_DATABASE
        run: node scripts/update-signatures.js

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- sharehorse.js; then
            echo "No signature changes today."
            exit 0
          fi
          git add sharehorse.js
          git commit -m "chore: update SharePoint signatures ($(date -u +%Y-%m-%d))"
          git push
